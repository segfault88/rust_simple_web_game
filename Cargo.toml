
[workspace]
resolver = "3"
members = ["client", "server", "shared"]
default-members = ["client", "server", "shared"]

[workspace.dependencies]
bincode = { version = "2.0.1", features = ["serde"] }
serde = { version = "1.0.228", features = ["serde_derive"] }
axum = "0.8.4"
axum-extra = "0.10.3"
futures-util = "0.3.31"
headers = "0.4.1"
js-sys = "0.3.81"
shared = { path = "shared" }
tokio = "1.47.1"
tokio-util = "0.7.16"
tower-http = "0.6.6"
tracing = "0.1.41"
tracing-subscriber = "0.3.20"
wasm-bindgen = "0.2.104"
wasm-bindgen-futures = "0.4.54"
web-sys = "0.3.81"
