name: Rust CI

on:
  # Trigger the workflow on push events to the 'main' branch only
  push:
    branches:
      - main

# A workflow run is made up of one or more jobs.
jobs:
  check_and_lint:
    # FIX: Removed the reference to runner.os from the job name,
    # as the 'runner' context is not fully initialized or accessible at this parsing stage.
    name: Check and Lint on ${{ matrix.toolchain }} (Ubuntu)
    # Run on the latest Ubuntu runner, which is standard for CI
    runs-on: ubuntu-latest

    # Use a matrix for the Rust toolchain (starting with stable)
    strategy:
      matrix:
        toolchain: [stable] # You can add 'beta', 'nightly' later if needed

    steps:
      - name: Checkout Repository
        # Action to pull the repository code
        uses: actions/checkout@v4

      - name: Cache Cargo Dependencies
        uses: actions/cache@v4
        with:
          # Caches the registry index, downloaded crates, and compiled output from 'target'
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          # The key invalidates the cache when the OS, Rust toolchain, or Cargo.lock file changes.
          # NOTE: runner.os is fine here because it's used inside the 'with' block of an action step.
          key: ${{ runner.os }}-${{ matrix.toolchain }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          # Restore keys allow retrieving a cache even if Cargo.lock has changed (useful for minor dependency changes)
          restore-keys: |
            ${{ runner.os }}-${{ matrix.toolchain }}-cargo-
            ${{ runner.os }}-cargo-

      - name: Install Rust Toolchain and Components
        # We use dtolnay/rust-toolchain for a modern, fast setup
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ matrix.toolchain }}
          # Ensure clippy is available for the linting step
          components: clippy
          targets: wasm32-unknown-unknown,x86_64-unknown-linux-musl

      - name: Run Cargo Check
        run: cargo check --all-features

      - name: Run Cargo Clippy (Warnings ok for now)
        run: cargo clippy --all-targets --all-features # -- -D warnings

      - name: Output dir
        run: mkdir -p out/static/pkg

      - name: Install wasm-pack
        run: cargo install wasm-pack

      - name: Build client
        run: |
          cd client
          wasm-pack build --target web --release
          cp index.html ../out/static/
          cp -Rv pkg/* ../out/static/pkg/
          cd ..

      - name: Build server
        run: |
          cargo build --bin server --release
          cp target/x86_64-unknown-linux-musl/server out/
